<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎁 Spin & Win Premium</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b,#020617);
    padding:20px;
}

.container{
    max-width:450px;
    width:100%;
    text-align:center;
}

h1{
    color:#fff;
    font-size:38px;
    text-shadow:0 0 20px cyan;
    margin-bottom:10px;
}

.info{
    color:#ddd;
    margin-bottom:20px;
}

.wheel-container{
    position:relative;
    width:340px;
    height:340px;
    margin:auto;
}

.pointer{
    position:absolute;
    top:-18px;
    left:50%;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:18px solid transparent;
    border-right:18px solid transparent;
    border-top:40px solid white;
    z-index:10;
}

#wheel{
    width:100%;
    height:100%;
    border-radius:50%;
    border:8px solid white;
    transition:transform 5s cubic-bezier(.17,.67,.12,.99);
    box-shadow:
        0 0 20px cyan,
        0 0 40px cyan,
        0 0 80px rgba(0,255,255,.4);

    background:conic-gradient(
        #ff4d4d 0deg 72deg,
        #ff9900 72deg 144deg,
        #00cc66 144deg 216deg,
        #0099ff 216deg 288deg,
        #cc33ff 288deg 360deg
    );
}

.center-circle{
    position:absolute;
    width:80px;
    height:80px;
    background:white;
    border-radius:50%;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    box-shadow:0 0 20px white;
}

.spin-btn{
    margin-top:25px;
    padding:15px 45px;
    border:none;
    border-radius:50px;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    background:linear-gradient(45deg,#00ffff,#00ff88);
    box-shadow:0 0 25px cyan;
    transition:.3s;
}

.spin-btn:hover{
    transform:scale(1.05);
}

#result{
    margin-top:25px;
    color:white;
    font-size:22px;
    line-height:1.7;
    font-weight:bold;
}

.prizes{
    margin-top:20px;
    color:#ddd;
    line-height:2;
}

.note{
    margin-top:15px;
    color:#ffd54f;
    font-size:13px;
}
</style>
</head>
<body>

<div class="container">

<h1>🎁 SPIN & WIN</h1>

<div class="info">
⏰ Daily Spin Opens at 5:00 PM
</div>

<div class="wheel-container">
    <div class="pointer"></div>
    <div id="wheel"></div>
    <div class="center-circle"></div>
</div>

<button class="spin-btn" onclick="spinWheel()">
🎡 SPIN NOW
</button>

<div id="result"></div>

<div class="prizes">
📺 YouTube Premium 1 Month<br>
🎬 Netflix Premium (Rare)<br>
🎵 Spotify Premium<br>
📺 ZEE5 Premium<br>
😢 Better Luck Next Time
</div>

<div class="note">
Only one spin allowed per day after 5:00 PM.
</div>

</div>

<script>

const prizes = [
    "📺 YouTube Premium 1 Month",
    "🎬 Netflix Premium",
    "🎵 Spotify Premium",
    "📺 ZEE5 Premium",
    "😢 Better Luck Next Time"
];

let spinning = false;

/* Weighted Prize System */
function getPrize(){

    let random = Math.random() * 100;

    if(random < 2){
        return 1; // Netflix 2%
    }
    else if(random < 22){
        return 0; // YouTube 20%
    }
    else if(random < 42){
        return 2; // Spotify 20%
    }
    else if(random < 62){
        return 3; // ZEE5 20%
    }
    else{
        return 4; // Better Luck 38%
    }
}

function spinWheel(){

    if(spinning) return;

    let now = new Date();

    let target = new Date();
    target.setHours(17,0,0,0);

    if(now < target){
        alert("⏰ Spin will be available after 5:00 PM.");
        return;
    }

    let lastSpin = localStorage.getItem("lastSpin");

    if(lastSpin){

        let nextAllowed = new Date(lastSpin);

        nextAllowed.setDate(nextAllowed.getDate()+1);
        nextAllowed.setHours(17,0,0,0);

        if(now < nextAllowed){
            alert("🚫 Next spin available tomorrow at 5:00 PM.");
            return;
        }
    }

    spinning = true;

    let randomIndex = getPrize();

    let degree =
        (360 * 8) +
        (randomIndex * (360 / prizes.length));

    document.getElementById("wheel").style.transform =
        `rotate(${degree}deg)`;

    setTimeout(() => {

        let prize = prizes[randomIndex];

        document.getElementById("result").innerHTML = `
            🎉 Congratulations!<br>
            You Won:<br>
            ${prize}
            <br><br>
            📸 Take a Screenshot and Send it to Claim Your Reward!
        `;

        alert(
            "🎉 Congratulations!\n\n" +
            "You Won: " + prize +
            "\n\n📸 Take a Screenshot and Send it to Claim Your Reward!"
        );

        localStorage.setItem("lastSpin", now.toISOString());

        spinning = false;

    },5000);
}

</script>

</body>
</html>
